<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Megasult</title>
    <meta name="robots" content="noindex" />
    <!-- Endereço do site antigo (/site). Redireciona para a raiz.
         Usa /index.html (e não /) para não cair em loop caso o navegador
         tenha guardado em cache o antigo redirect "/ -> /site". -->
    <link rel="canonical" href="https://www.megasult.com.br/" />
    <meta http-equiv="refresh" content="0; url=/index.html" />
    <script>
      location.replace("/index.html" + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>Redirecionando para <a href="/index.html">www.megasult.com.br</a>…</p>
  </body>
</html>
